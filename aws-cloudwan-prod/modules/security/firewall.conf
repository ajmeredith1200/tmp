Content-Type: multipart/mixed; boundary="==AWS=="
MIME-Version: 1.0

--==AWS==
Content-Type: text/x-shellscript; charset="us-ascii"
MIME-Version: 1.0

config system global
set hostname ${hostname}
set admin-sport ${adminsport}
end
config system interface
edit port1
set mode dhcp
set allowaccess ping https ssh fgfm
next
edit port2
set mode dhcp
set allowaccess ping probe-response
set defaultgw disable
next
end
config system probe-response
set mode http-probe
end
config system geneve
edit "awsgeneve1"
set interface "port2"
set type ppp
set remote-ip ${endpointip1}
next
edit "awsgeneve2"
set interface "port2"
set type ppp
set remote-ip ${endpointip2}
next
end
config system zone
edit INET
set interface port1
next
edit AWS
set interface port2
next
edit LAN
set interface awsgeneve1 awsgeneve2
next
end
config firewall policy
edit 1
set name "test"
set srcintf "LAN"
set dstintf "LAN"
set srcaddr "all"
set dstaddr "all"
set action accept
set schedule "always"
set service "ALL"
set logtraffic all
next
end
config router static
edit 1
set device awsgeneve1
next
edit 2
set device awsgeneve2
next
edit 3
set device port2
set dst ${vpc_cidr} 
set gateway ${internal_gateway}
next
end
config router policy
edit 1
set input-device "awsgeneve1"
set src "0.0.0.0/0.0.0.0"
set dst "0.0.0.0/0.0.0.0"
set output-device "awsgeneve1"
next
edit 2
set input-device "awsgeneve2"
set src "0.0.0.0/0.0.0.0"
set dst "0.0.0.0/0.0.0.0"
set output-device "awsgeneve2"
next
end
--==AWS==--